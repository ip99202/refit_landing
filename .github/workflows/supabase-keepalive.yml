name: Supabase DB Keep-Alive

on:
  schedule:
    - cron: '0 3 * * *'   # UTC 03:00 = KST 12:00
  workflow_dispatch:      # 수동 실행 가능

jobs:
  keepalive:
    runs-on: ubuntu-latest
    environment: SUPABASE_URL   # Environment secrets 사용
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          SUPABASE_URL="${SUPABASE_URL%/}"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            --connect-timeout 10 \
            -X GET "${SUPABASE_URL}/rest/v1/user_info_landing?select=*" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: ${HTTP_CODE}"
          echo "Response Body:"
          echo "$BODY" | python3 -m json.tool || echo "$BODY"
          [ "$HTTP_CODE" != "000" ] || exit 1
